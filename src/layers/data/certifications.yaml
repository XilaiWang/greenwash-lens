# Greenwashing Lens — Layer 5a certification seed library.
#
# A curated registry of well-known ESG / sustainability certifications,
# reporting frameworks, and assurance standards. Layer 5a uses this to:
#   1. Detect when a claim mentions one of these by name
#      (counter-signal for Sin #2 No Proof).
#   2. Flag "self-certified" / "our own standard" patterns separately
#      (Sin #4 Worshiping False Labels — handled in L5a code,
#       not by individual entries here).
#   3. Tell future Layer 6 which certs are actually issued by the
#      named authority (basic sanity for fake-cert detection).
#
# Schema per entry:
#   id                   stable snake_case slug used as the key
#   name                 { zh, en } display names
#   authority            issuing organization (string)
#   domain               array of topic tags (carbon, ghg, water, ...)
#   identifier_pattern   case-insensitive JS regex (use \\ not \) to detect mentions
#   verification_url     official source for lookup
#   type                 process | product | management_system | reporting_framework
#                        | assurance | initiative
#   region               global | eu | us | uk | cn | ...
#   founded_year         helpful for irrelevance check (e.g. CFC bans)
#   official             true for recognized standards;
#                        reserved-false for known self-certs (none in v1)
#
# Coverage: this v1 seed is ~40 entries spanning the major frameworks.
# Add/edit freely — no migration needed, just keep the schema fields.

version: 1
last_updated: 2026-05-17

