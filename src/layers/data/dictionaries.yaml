# Greenwash Lens — Layer 1 dictionaries.
#
# This file is the source of truth for keyword-based feature extraction
# starting in Stage 1. It was lifted verbatim from src/engine-core.js
# (v0.9.0) so behavior is preserved during the architectural refactor.
#
# Matching rules (see src/layers/L1-features.js):
#   - Case-insensitive substring inclusion (text.toLowerCase().includes(term))
#   - Bilingual: English and Chinese terms coexist per category
#   - Order does not matter
#
# Each category maps to a TerraChoice "Seven Sins" dimension where applicable:
#   greenClaims   — gate signal: is this a green claim at all?
#   vague         — Sin #3 Vagueness
#   absolute      — Sin #1 Hidden Trade-off + Sin #7 Fibbing (overclaim)
#   proof         — counter-signal for Sin #2 No Proof
#   future        — discriminates achievements vs commitments
#   emotional     — emotional appeal as evidence substitute
#   action        — counter-signal: language of completed action
#   scope         — boundary specification (Scope 1/2/3, baseline, etc.)
#
# When updating: keep parity with src/engine-core.js inline arrays until
# that file's `scoreText` is fully retired (Stage 7 per the plan).
# The test test/layer1-features.test.js verifies parity at CI time.

version: 1

categories:
  greenClaims:
    description: ESG topic markers — used to detect if a text is a green claim at all.
    terms:
      # English
      - green
      - eco
      - environment
      - sustainable
      - sustainability
      - carbon
      - emission
      - net zero
      - climate
      - renewable
      - recyclable
      - biodegradable
      - circular
      - zero waste
      - low-carbon
      - decarbonization
      - decarbonisation
      - clean energy
      - energy efficient
      - emissions reduction
      - climate positive
      # Chinese
      - 绿色
      - 环保
      - 可持续
      - 低碳
      - 碳中和
      - 净零
      - 减排
      - 排放
      - 气候
      - 可再生
      - 回收
      - 循环
      - 降解
      - 节能
      - 清洁能源
      - 绿色生产
      - 绿色供应链
      - 绿色包装
      - 节水
      - 生态
      - esg

  vague:
