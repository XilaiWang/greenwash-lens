      - strive
      - committed to
      - leading
      - greener
      - eco-friendly
      - planet-friendly
      - minimize impact
      - sustainable future
      - responsible choice
      - better for the planet
      - nature positive
      - conscious
      - cleaner future
      - low impact
      - 致力于
      - 努力
      - 持续推进
      - 绿色未来
      - 更绿色
      - 更环保
      - 环境友好
      - 显著
      - 有效
      - 积极
      - 全面
      - 助力
      - 打造
      - 引领
      - 不断
      - 守护地球
      - 绿色生活
      - 自然之选
      - 低影响

  absolute:
    description: |
      Absolute/superlative claims that require strong evidence
      (Sin #1 Hidden Trade-off + Sin #7 Fibbing).
    terms:
      - 100%
      - zero emissions
      - carbon neutral
      - net zero
      - no environmental impact
      - planet positive
      - completely sustainable
      - all natural
      - fully green
      - best in class
      - guilt-free
      - 零排放
      - 碳中和
      - 净零
      - 无污染
      - 对环境无影响
      - 完全可持续
      - 百分百环保
      - 全部使用
      - 行业领先
      - 最环保

  proof:
    description: |
      Evidence/certification markers — COUNTER-signal for Sin #2 No Proof.
      Presence reduces the evidence-gap score.
    terms:
      - third-party
      - verified
      - certified
      - audited
      - assurance
      - iso
      - gri
      - sbti
      - cdp
      - lca
      - life cycle
      - methodology
      - science based
      - independently verified
      - 第三方
      - 核证
      - 认证
      - 审计
      - 鉴证
      - 生命周期
      - 方法学
      - 数据来源
      - 科学碳目标
      - 独立验证

  future:
    description: |
      Future-tense / commitment markers — distinguishes promises
      (still verifying) from achievements (verifiable now).
    terms:
